name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar projeto
        run: unzip -q HamburgueriaZ.zip -d projeto

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Compilar APK de debug
        working-directory: projeto/HamburgueriaZ
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HamburgueriaZ-apk
          path: projeto/HamburgueriaZ/app/build/outputs/apk/debug/app-debug.apk
